[package]
name = "chrome-cdp"
description = "Drive Chrome over the DevTools Protocol from a shell; built for AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
# The integration tests need the repo's fixture site and a Chrome.
exclude = ["tests/"]
readme = "../../README.md"
keywords = ["chrome", "cdp", "devtools", "browser-automation", "agents"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming"]

[[bin]]
name = "chrome-cdp"
path = "src/main.rs"

[dependencies]
base64.workspace = true
browser.workspace = true
cdp.workspace = true
clap.workspace = true
clap_complete.workspace = true
daemon.workspace = true
e2e.workspace = true
mock.workspace = true
engine.workspace = true
flate2.workspace = true
futures-util.workspace = true
hdrhistogram.workspace = true
protocol.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tar.workspace = true
url.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
browser = { workspace = true, features = ["test-support"] }
fixtures.workspace = true
load-server.workspace = true
regex.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true

# `cargo binstall chrome-cdp` takes the release archive (plan 10.5); on Linux
# it falls back from the gnu target to the static musl build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/chrome-cdp-{ target }.tar.gz"
bin-dir = "chrome-cdp-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
