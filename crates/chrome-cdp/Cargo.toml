[package]
name = "chrome-cdp"
description = "Drive Chrome over the DevTools Protocol from a shell; built for AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "chrome-cdp"
path = "src/main.rs"

[dependencies]
browser.workspace = true
cdp.workspace = true
clap.workspace = true
daemon.workspace = true
engine.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
browser = { workspace = true, features = ["test-support"] }
fixtures.workspace = true
tempfile.workspace = true

[lints]
workspace = true
