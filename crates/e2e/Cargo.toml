[package]
name = "chrome-cdp-e2e"
description = "E2E testing of a project (plan 11): the [e2e] config, web servers and `init e2e`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# The integration tests need the repo's fixture site and a Chrome.
exclude = ["tests/"]

[lib]
name = "e2e"

[dependencies]
browser.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
mock.workspace = true
percent-encoding.workspace = true
protocol.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt"] }

[lints]
workspace = true
