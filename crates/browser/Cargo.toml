[package]
name = "chrome-cdp-browser"
description = "Chrome discovery, install (Chrome for Testing), launch flags and profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
# The integration tests need the repo's fixture site and a Chrome.
exclude = ["tests/"]

[lib]
name = "browser"

[dependencies]
cdp.workspace = true
protocol.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
tracing.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
# Process groups, PR_SET_PDEATHSIG and the effective uid (launch::sys).
libc.workspace = true
# Removes macOS's quarantine attribute after install (also builds and is
# tested on Linux).
xattr = "1.6"

[features]
# `browser::testing`: a fake Chrome for Testing server for other crates' tests.
test-support = []

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
