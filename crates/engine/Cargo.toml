[package]
name = "chrome-cdp-engine"
description = "The daemon's brain: targets, navigation, waits, snapshots, locators, input, observation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
# The integration tests need the repo's fixture site and a Chrome.
exclude = ["tests/"]

[lib]
name = "engine"

[dependencies]
base64.workspace = true
browser.workspace = true
cdp.workspace = true
flate2.workspace = true
png.workspace = true
mock.workspace = true
protocol.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
similar.workspace = true
strsim.workspace = true
sourcemap.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
fixtures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "test-util"] }

[lints]
workspace = true
