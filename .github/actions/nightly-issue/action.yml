name: File a nightly failure
description: >
  Opens an issue for a failed nightly job, or comments on the open one with
  the same title, so a failure is never only a red mark in the Actions tab
  (plan 10, milestone 10.1). The job needs `permissions: issues: write`.
inputs:
  title:
    description: The issue's title; one open issue per title.
    required: true
  summary:
    description: A markdown file with what failed; missing is fine.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: ${{ inputs.title }}
        SUMMARY: ${{ inputs.summary }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        body="$( [ -n "$SUMMARY" ] && [ -f "$SUMMARY" ] && cat "$SUMMARY" || echo 'The job failed; see its log.')"
        body="$body"$'\n\n'"Run: $RUN_URL"
        gh label create nightly --color B60205 --description "A nightly job failed" --force
        number="$(gh issue list --state open --label nightly --json number,title \
          --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
        if [ -n "$number" ]; then
          gh issue comment "$number" --body "$body"
        else
          gh issue create --title "$TITLE" --label nightly --body "$body"
        fi
