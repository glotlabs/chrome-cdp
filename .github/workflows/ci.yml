name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux x86_64
          - ubuntu-24.04-arm   # linux arm64
          - macos-latest       # macOS arm64
          - macos-15-intel     # macOS x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # CDP integration tests run against the runner's preinstalled Google
      # Chrome. Ubuntu ships an AppArmor profile for /opt/google/chrome, so the
      # sandbox works there. There is no Google Chrome for Linux arm64; that
      # runner only covers the pipe transport with a stand-in child.
      - name: Locate Chrome
        shell: bash
        run: |
          for c in /opt/google/chrome/chrome "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if [ -x "$c" ]; then
              echo "CHROME_PATH=$c" >> "$GITHUB_ENV"
              echo "CHROME_CDP_REQUIRE_CHROME=1" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::no Chrome on this runner; CDP integration tests are skipped"
      - run: cargo xtask ci
      # Plan 02: no test may leave a Chrome it launched, its watchdog, or a
      # session daemon running. Only chrome-cdp starts Chrome with
      # --remote-debugging-pipe.
      - name: No leftover Chrome or daemon processes
        shell: bash
        run: |
          sleep 2
          if pgrep -fl -- '--remote-debugging-pipe|chrome-cdp-watchdog|chrome-cdp __daemon'; then
            echo "::error::Chrome or daemon processes outlived the tests"
            exit 1
          fi

  # Plan 11.10: a Next.js app whose server-side fetches the mocks answer
  # through `mock serve`. Its build is not committed, so this job needs
  # Node; examples/e2e-shop (no Node) runs in every `ci` job's tests.
  e2e-ssr:
    name: e2e-ssr (Next.js, mock serve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/e2e-ssr/package-lock.json
      - run: cargo build --locked -p chrome-cdp
      - name: Build the app
        working-directory: examples/e2e-ssr
        run: npm ci && npm run build
      - name: Run its scenarios
        working-directory: examples/e2e-ssr
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: |
          ../../target/debug/chrome-cdp fmt --check
          ../../target/debug/chrome-cdp lint --format github
          ../../target/debug/chrome-cdp test --reporter text,junit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ssr-results
          path: examples/e2e-ssr/e2e/.results/

  dist:
    name: dist size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask dist

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
