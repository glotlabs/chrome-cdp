name: Nightly

# Installs Chrome for Testing for real on every OS and architecture
# (plan 02, milestone 2.2), so a change in the index or the zips shows up.
# Runs the flakiness gate and the soak tests (plan 10, milestone 10.1) and
# the benchmarks' regression gates (10.4): a failure of any opens an issue.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux64
          - ubuntu-24.04-arm   # linux-arm64
          - macos-latest       # mac-arm64
          - macos-15-intel     # mac-x64
    # The default cache dir (under $HOME): a fresh runner has none.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p chrome-cdp
      # install checks on Linux that the browser starts (`--version`) and
      # fails with the missing libraries if it does not. --with-deps also
      # writes the AppArmor profile that Ubuntu 23.10+ needs for Chrome's
      # sandbox (runners have passwordless sudo); on macOS it only warns.
      - run: target/release/chrome-cdp install --with-deps
      - run: target/release/chrome-cdp install --headless-shell --with-deps
      - run: target/release/chrome-cdp install --list
      - name: The installed binaries run
        shell: bash
        run: |
          "$(target/release/chrome-cdp install -q)" --version
          "$(target/release/chrome-cdp install --headless-shell -q)" --version
      # With the sandbox on: never --no-sandbox.
      - name: Launch the installed browsers
        shell: bash
        run: |
          target/release/chrome-cdp open https://example.com
          target/release/chrome-cdp cdp Browser.getVersion
          target/release/chrome-cdp close
          target/release/chrome-cdp open --session shell \
            --chrome "$(target/release/chrome-cdp install --headless-shell -q)"
          target/release/chrome-cdp cdp Browser.getVersion --session shell
          target/release/chrome-cdp close --session shell

  # Plan 11.10: the E2E acceptance suite, 20 times over (no flaky test may
  # pass), and against its real API with the mocks compared to it.
  e2e-shop:
    name: e2e-shop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: examples/e2e-shop
    env:
      CHROME_CDP_AUTO_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p chrome-cdp -p fixtures
      - run: ../../target/debug/chrome-cdp test --repeat 20 --reporter text,junit
      - run: ../../target/debug/chrome-cdp test --backend local --verify-mocks
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-shop-results-${{ matrix.os }}
          path: examples/e2e-shop/e2e/.results/

  # Plan 10.1: the flakiness gate. The whole suite 20 times per runner with
  # retries off (nextest's `ci` profile) and a leak check after each run.
  # Any failed run opens an issue.
  flaky:
    name: flaky (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux x86_64
          - ubuntu-24.04-arm   # linux arm64
          - macos-latest       # macOS arm64
          - macos-15-intel     # macOS x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # CfT stable, as the `ci` workflow's main jobs.
      - name: Chrome stable
        run: cargo xtask chrome stable --with-deps
      - run: cargo xtask e2e --repeat 20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flaky-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
      - uses: ./.github/actions/nightly-issue
        if: failure()
        with:
          title: "Nightly: the flakiness gate failed on ${{ matrix.os }}"
          summary: target/nextest/e2e-summary.md

  # Plan 10.1: 1,000 random commands against the fixture site (no crash,
  # bounded RSS, p99 within budget) and the hour of constant logging.
  soak:
    name: soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Chrome stable
        run: cargo xtask chrome stable --with-deps
      - run: cargo xtask soak
      - uses: ./.github/actions/nightly-issue
        if: failure()
        with:
          title: "Nightly: the soak tests failed on ${{ matrix.os }}"

  # Plan 10.4: the token and micro benchmarks, each failing on a metric
  # more than 15% worse than its committed baseline (bench/baselines/; a
  # runner without a micro baseline only warns). The plans' ignored timing
  # tests are left to `cargo xtask bench micro` by hand (--no-tests): shared
  # runners are too noisy for their absolute budgets.
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: bench/playwright
      - name: Chrome stable
        run: cargo xtask chrome stable --with-deps
      - run: cargo xtask bench tokens -- --check --no-publish
      - run: cargo xtask bench micro --no-tests -- --check --no-publish
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: bench-${{ matrix.os }}
          path: target/bench/
      - uses: ./.github/actions/nightly-issue
        if: failure()
        with:
          title: "Nightly: a benchmark regressed on ${{ matrix.os }}"
