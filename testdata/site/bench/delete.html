<!doctype html>
<meta charset="utf-8">
<title>Account settings</title>
<script src="record.js"></script>
<h1>Account settings</h1>
<h2>Danger zone</h2>
<button id="delete">Delete account</button>
<p role="status" id="status"></p>
<script>
  document.getElementById('delete').addEventListener('click', async () => {
    const status = document.getElementById('status');
    if (!confirm('Delete your account? This cannot be undone.')) { status.textContent = 'Kept your account.'; return; }
    const typed = prompt('Type DELETE to confirm.');
    if (typed !== 'DELETE') { status.textContent = 'Not deleted: you did not type DELETE.'; return; }
    await record({ form: 'delete', confirmed: typed });
    status.textContent = 'Your account is scheduled for deletion.';
  });
</script>
