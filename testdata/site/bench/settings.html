<!doctype html>
<meta charset="utf-8">
<title>Preferences</title>
<script src="record.js"></script>
<h1>Preferences</h1>
<app-preferences></app-preferences>
<script>
  // A web component: its controls live in a closed-off shadow root.
  customElements.define('app-preferences', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>label{display:block;margin:.5rem 0}</style>
        <label><input type="checkbox" role="switch" id="dark"> Dark mode</label>
        <label>Language
          <select id="lang">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="nb">Norsk bokmål</option>
          </select>
        </label>
        <label>Items per page <input id="per-page" type="number" value="20" min="5" max="100"></label>
        <button id="save">Save preferences</button>
        <p role="status" id="status"></p>`;
      root.getElementById('save').addEventListener('click', async () => {
        await record({ form: 'preferences', dark: root.getElementById('dark').checked,
          language: root.getElementById('lang').value, per_page: Number(root.getElementById('per-page').value) });
        root.getElementById('status').textContent = 'Saved.';
      });
    }
  });
</script>
