<!doctype html>
<html>
<head><meta charset="utf-8"><title>Permissions</title></head>
<body>
<p>Asks for the state of a permission and the position.</p>
<script>
  window.state = (name) => navigator.permissions.query({ name }).then((s) => s.state);
  window.position = () =>
    new Promise((resolve, reject) =>
      navigator.geolocation.getCurrentPosition(
        (p) => resolve([p.coords.latitude, p.coords.longitude, p.coords.accuracy]),
        (e) => reject(new Error(e.message)),
        { timeout: 5000 },
      ),
    );
</script>
</body>
</html>
