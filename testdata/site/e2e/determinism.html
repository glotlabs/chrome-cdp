<!doctype html>
<!-- chrome-cdp test's determinism (plan 11.6): what the page sees of the
     time, random values, animations and the environment. -->
<meta charset="utf-8">
<title>determinism</title>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  #spinner { animation: spin 10s linear infinite; transition: opacity 5s; }
</style>
<div id="spinner">spinner</div>
<p id="now"></p>
<p id="random"></p>
<p id="uuid"></p>
<p id="bytes"></p>
<p id="server"></p>
<p id="session">Session active</p>
<p id="worker"></p>
<!-- Web components: an animation in a shadow root attached by a script,
     and in one the parser made. -->
<div id="host"></div>
<div id="declared"><template shadowrootmode="open"><style>
  @keyframes pulse { to { opacity: 0.5; } }
  #inner { animation: pulse 10s linear infinite; }
</style><div id="inner">declared</div></template></div>
<script>
  document.getElementById("host").attachShadow({ mode: "open" }).innerHTML = `<style>
    @keyframes pulse { to { opacity: 0.5; } }
    #inner { animation: pulse 10s linear infinite; }
  </style><div id="inner">attached</div>`;
</script>
<script>
  const show = (id, text) => { document.getElementById(id).textContent = text; };
  show("now", new Date().toISOString());
  show("random", String(Math.random()));
  show("uuid", crypto.randomUUID());
  show("bytes", crypto.getRandomValues(new Uint8Array(4)).join(","));
  fetch("/e2e/api/now")
    .then((r) => r.json())
    .then((j) => show("server", "server " + j.now));
  new Worker("/e2e/determinism-worker.js").onmessage = (e) => show("worker", e.data);
  // The session expires after five minutes.
  setTimeout(() => show("session", "Session expired"), 5 * 60 * 1000);
</script>
