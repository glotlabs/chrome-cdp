<!doctype html>
<meta charset="utf-8">
<title>Obscured, busy frame</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #under { position: fixed; left: 40px; bottom: 40px; }
  .cookie-banner { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; background: #eee; z-index: 10; }
  iframe { width: 200px; height: 60px; }
</style>
<p id="log"></p>
<!-- An ad-like frame that loads a new document every 50 ms, so the tab's
     documents keep changing while the banner covers the button. -->
<iframe id="busy" srcdoc="<p>ad 0</p>"></iframe>
<button id="under">Sign in</button>
<div class="cookie-banner">
  <p>We use cookies</p>
  <button id="accept" onclick="this.parentElement.remove()">Accept</button>
</div>
<script src="log.js"></script>
<script>
  let n = 0;
  setInterval(() => { document.getElementById('busy').srcdoc = `<p>ad ${++n}</p>`; }, 50);
</script>
