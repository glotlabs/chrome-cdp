<title>Scroll</title>

  #box { height: 200px; width: 300px; overflow: auto; margin-top: 2000px; border: 1px solid; }
  #wide { width: 4000px; }
</style>
<p id="log"></p>
<p><button id="near">Near</button></p>
<div id="box">

  <div style="height: 500px"></div>
</div>
<div style="height: 3000px"></div>
<div id="wide"><button id="right" style="margin-left: 3500px">Right</button></div>
<p><button id="far">Far</button></p>
<script src="log.js"></script>
