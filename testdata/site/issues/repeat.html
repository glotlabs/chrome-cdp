<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Repeats</title>
</head>
<body>
  <p>The same request to the other site, which sends no CORS headers, 50
  times: one issue, counted.</p>
  <script>
    for (let i = 0; i < 50; i++) {
      fetch('{{ORIGIN_B}}/issues/data.json?n=' + i).catch(() => {});
    }
  </script>
</body>
</html>
