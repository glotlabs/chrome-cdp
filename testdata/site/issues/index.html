<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Issues</title>
  <!-- Blocks the inline script below: a CSP issue. Scripts come from this origin. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <script src="issues.js"></script>
</head>
<body>
  <h1>Issues</h1>
  <form>
    <!-- A label for an id no field has: a form issue. -->
    <label for="mail">Email</label>
    <input id="email" name="email" autocomplete="email">
  </form>
  <script>document.title = 'inline ran';</script>
  <!-- Iframes raise their own: one of another site (its own process),
       one of this site (this page's). -->
  <iframe id="frame" src="{{ORIGIN_B}}/issues/frame.html" title="other site"></iframe>
  <iframe id="same" name="same" src="same.html" title="same site"></iframe>
</body>
</html>
