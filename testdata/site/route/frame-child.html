<!doctype html>
<html>
<head><meta charset="utf-8"><title>child</title></head>
<body>
<p id="out">waiting</p>
<script>
  // An out-of-process frame (the other origin) fetching on load.
  fetch("/route/api/frame")
    .then((r) => r.text())
    .then((text) => { document.getElementById("out").textContent = text.trim(); });
</script>
</body>
</html>
