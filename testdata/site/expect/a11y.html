<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>Accessibility problems</title>
<style>
  .faint { color: #bbb; background: #fff; }
  .big-faint { color: #888; font-size: 32px; }
</style>
</head>
<body>
<main>
  <h1>Shop</h1>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40">
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" width="40" height="40">
  <button id="icon"><svg width="10" height="10"></svg></button>
  <button id="named">Buy</button>
  <form id="signup">
    <input id="nameless" type="text">
    <label>Email <input id="email" type="email"></label>
    <input type="hidden" name="token" value="x">
  </form>
  <p class="faint">Fine print nobody can read</p>
  <p class="big-faint">Large grey heading-ish text</p>
  <a href="/"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Home"></a>
  <div aria-hidden="true"><a href="/hidden">Hidden link</a></div>
</main>
</body>
</html>
