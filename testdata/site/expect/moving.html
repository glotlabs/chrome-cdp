<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moving fixture</title>
<style>
  body { font: 16px sans-serif; margin: 0; }
  #stage { position: relative; width: 240px; height: 80px; background: #fff; }
  #name { position: absolute; left: 8px; top: 8px; width: 120px; font-size: 20px; caret-color: #000; }
  /* Turns for ever. */
  #spinner {
    position: absolute; left: 160px; top: 10px; width: 40px; height: 40px;
    background: linear-gradient(90deg, #c33 50%, #36c 50%);
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Slides for 5s once the page has loaded. */
  #bar {
    position: absolute; left: 0; top: 64px; width: 20px; height: 8px; background: #393;
    transition: width 5s linear;
  }
  #bar.wide { width: 240px; }
</style>
</head>
<body>
<div id="stage">
  <input id="name" value="Ada">
  <div id="spinner"></div>
  <div id="bar"></div>
</div>
<script>
  // Everything moves: the caret blinks in the focused field, the spinner
  // turns and the bar slides.
  document.getElementById('name').focus();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('bar').classList.add('wide');
  }));
</script>
</body>
</html>
