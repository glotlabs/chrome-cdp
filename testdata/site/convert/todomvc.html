<!doctype html>
<meta charset="utf-8">
<title>TodoMVC</title>
<!-- A TodoMVC with the DOM of demo.playwright.dev/todomvc (test ids,
     labels, classes and the react-todos localStorage key), so the suite
     in testdata/convert/playwright-todomvc runs on it once converted. -->
<style>
  body { font: 16px sans-serif; max-width: 34rem; margin: 2rem auto; }
  .new-todo, .edit { font: inherit; width: 100%; box-sizing: border-box; padding: .5rem; }
  .todo-list { list-style: none; padding: 0; }
  .todo-list li { display: flex; align-items: center; border-bottom: 1px solid #ddd; padding: .4rem 0; }
  .todo-list li .view { display: flex; align-items: center; gap: .5rem; flex: 1; }
  .todo-list li .view label { flex: 1; }
  .todo-list li.completed label { text-decoration: line-through; color: #888; }
  .todo-list li.editing .view { display: none; }
  .filters { display: inline-flex; gap: .5rem; list-style: none; padding: 0; }
  .filters a.selected { font-weight: bold; }
  .footer { display: flex; gap: 1rem; align-items: center; }
  .destroy::after { content: "×"; }
</style>
<section class="todoapp">
  <header class="header">
    <h1>todos</h1>
    <input class="new-todo" placeholder="What needs to be done?" autofocus>
  </header>
  <section class="main" hidden>
    <input id="toggle-all" class="toggle-all" type="checkbox">
    <label for="toggle-all">Mark all as complete</label>
    <ul class="todo-list"></ul>
  </section>
  <footer class="footer" hidden>
    <span class="todo-count" data-testid="todo-count"></span>
    <ul class="filters">
      <li><a href="#/">All</a></li>
      <li><a href="#/active">Active</a></li>
      <li><a href="#/completed">Completed</a></li>
    </ul>
    <button class="clear-completed">Clear completed</button>
  </footer>
</section>
<script>
  const KEY = "react-todos";
  let todos = JSON.parse(localStorage[KEY] || "[]");
  let editing = null;
  const $ = (s) => document.querySelector(s);
  const list = $(".todo-list");

  function save() {
    localStorage[KEY] = JSON.stringify(todos);
    render();
  }

  function filter() {
    return location.hash.replace(/^#\/?/, "") || "all";
  }

  function render() {
    const shown = todos.filter((t) =>
      filter() === "active" ? !t.completed : filter() === "completed" ? t.completed : true);
    list.replaceChildren(...shown.map(item));
    $(".main").hidden = $(".footer").hidden = todos.length === 0;
    $("#toggle-all").checked = todos.length > 0 && todos.every((t) => t.completed);
    const left = todos.filter((t) => !t.completed).length;
    $(".todo-count").innerHTML = `<strong>${left}</strong> ${left === 1 ? "item" : "items"} left`;
    for (const a of document.querySelectorAll(".filters a")) {
      const name = a.getAttribute("href").replace(/^#\/?/, "") || "all";
      a.className = name === filter() ? "selected" : "";
    }
    $(".clear-completed").hidden = !todos.some((t) => t.completed);
    const edit = list.querySelector(".edit");
    if (edit) edit.focus();
  }

  function item(todo) {
    const li = document.createElement("li");
    li.dataset.testid = "todo-item";
    li.className = [todo.completed && "completed", editing === todo.id && "editing"]
      .filter(Boolean).join(" ");
    const view = document.createElement("div");
    view.className = "view";
    const toggle = document.createElement("input");
    toggle.className = "toggle";
    toggle.type = "checkbox";
    toggle.checked = todo.completed;
    toggle.addEventListener("change", () => {
      todo.completed = toggle.checked;
      save();
    });
    const label = document.createElement("label");
    label.dataset.testid = "todo-title";
    label.textContent = todo.title;
    const destroy = document.createElement("button");
    destroy.className = "destroy";
    destroy.setAttribute("aria-label", "Delete");
    destroy.addEventListener("click", () => {
      todos = todos.filter((t) => t !== todo);
      save();
    });
    view.append(toggle, label, destroy);
    li.append(view);
    li.addEventListener("dblclick", () => {
      editing = todo.id;
      render();
    });
    if (editing === todo.id) {
      const edit = document.createElement("input");
      edit.className = "edit";
      edit.value = todo.title;
      edit.setAttribute("aria-label", "Edit");
      const finish = (keep) => {
        if (editing !== todo.id) return;
        editing = null;
        const title = edit.value.trim();
        if (!keep) render();
        else if (title) {
          todo.title = title;
          save();
        } else {
          todos = todos.filter((t) => t !== todo);
          save();
        }
      };
      edit.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true);
        if (e.key === "Escape") finish(false);
      });
      edit.addEventListener("blur", () => finish(true));
      li.append(edit);
    }
    return li;
  }

  $(".new-todo").addEventListener("keydown", (e) => {
    const title = e.target.value.trim();
    if (e.key !== "Enter" || !title) return;
    todos.push({ id: `${Date.now()}-${todos.length}-${Math.random()}`, title, completed: false });
    e.target.value = "";
    save();
  });
  $("#toggle-all").addEventListener("change", (e) => {
    for (const t of todos) t.completed = e.target.checked;
    save();
  });
  $(".clear-completed").addEventListener("click", () => {
    todos = todos.filter((t) => !t.completed);
    save();
  });
  addEventListener("hashchange", render);
  render();
</script>
