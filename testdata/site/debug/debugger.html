<!doctype html>
<title>debugger</title>
<button id="go" style="width: 50px">Go</button>
<p id="out"></p>
<script>
  let runs = 0;
  document.getElementById("go").addEventListener("click", () => {
    runs += 1;
    debugger;
    document.getElementById("out").textContent = `ran ${runs}`;
  });
</script>
