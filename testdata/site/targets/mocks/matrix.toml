# The target matrix's mock set (plan 13.2): each frame and worker's
# /targets/api answer comes from here, /targets/unmatched has no mock
# (the set owns it: the request fails), and /targets/ws is a WebSocket.
[settings]
scope = ["/targets/api", "/targets/unmatched", "/targets/ws"]

[[mock]]
name = "api"
match = { method = "GET", path = "/targets/api" }
respond = { json = { from = "mocked {{query.from}}" } }

[[websocket]]
name = "matrix socket"
url = "/targets/ws"
on_open = [{ send = "hello" }]
on_message = [{ match = "ping", send = "pong" }]
