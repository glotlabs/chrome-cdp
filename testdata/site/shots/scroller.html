<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>App that scrolls inside a container</title>
<style>
  /* The document never scrolls: <main> (and the smaller sidebar) do. */
  html, body { height: 100%; margin: 0; overflow: hidden; font: 16px sans-serif; }
  * { scrollbar-width: none; }
  body { display: flex; flex-direction: column; }
  header { height: 60px; flex: none; background: rgb(0, 0, 255); color: #fff; }
  .columns { flex: 1; display: flex; min-height: 0; }
  #side { width: 200px; overflow-y: auto; background: #eee; }
  #side .item { height: 100px; border-bottom: 1px solid #ccc; box-sizing: border-box; }
  #side-end { background: rgb(255, 255, 0); }
  main { flex: 1; overflow: auto; }
  main .row { height: 300px; }
  #first { background: rgb(255, 0, 0); }
  #last { background: rgb(0, 200, 0); }
</style>
</head>
<body>
<header></header>
<div class="columns">
  <nav id="side"></nav>
  <main id="feed"></main>
</div>
<script>
  // A 3000px feed (10 rows, the first red, the last green) and a 2000px
  // sidebar (the last item yellow); no text, so the image is the same on
  // every OS.
  const feed = document.getElementById('feed');
  for (let i = 1; i <= 10; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    if (i === 1) row.id = 'first';
    if (i === 10) row.id = 'last';
    feed.append(row);
  }
  const side = document.getElementById('side');
  for (let i = 1; i <= 20; i++) {
    const item = document.createElement('div');
    item.className = 'item';
    if (i === 20) item.id = 'side-end';
    side.append(item);
  }
</script>
</body>
</html>
