<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Annotate</title>
<style>
  /* Plain boxes and no text of the page's own, so the golden image
     changes only with the labels. */
  html, body { margin: 0; background: #fff; width: 400px; height: 300px; overflow: hidden; }
  button, input, a { position: absolute; display: block; box-sizing: border-box; border: 0;
    padding: 0; background: #ccc; color: transparent; font-size: 1px; }
  #go { left: 40px; top: 60px; width: 120px; height: 40px; }
  #name { left: 200px; top: 60px; width: 160px; height: 40px; }
  #help { left: 40px; top: 160px; width: 80px; height: 30px; }
  #far { left: 40px; top: 2000px; width: 80px; height: 30px; }
</style>
</head>
<body>
<button id="go">Go</button>
<input id="name" aria-label="Name">
<a id="help" href="#help">Help</a>
<button id="far">Far away</button>
</body>
</html>
