<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Page size</title>
  <link rel="icon" href="data:,">
  <!-- pdf --css-page-size prints on these 4in squares; without it, on
       --format's paper. -->
  <style>
    @page { size: 4in 4in; margin: 0; }
    body { margin: 0; }
    div { height: 12in; background: #eee; }
  </style>
</head>
<body><div>Twelve inches tall.</div></body>
</html>
