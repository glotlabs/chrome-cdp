<!doctype html>
<meta charset="utf-8">
<title>Layout: long</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- One finding with --full, none without: a button far below the fold,
     under an overlay. -->
<style>
  body { margin: 0; font: 16px sans-serif; color: #222; background: #fff; }
  .spacer { height: 2000px; }
  .low { position: relative; height: 100px; }
  #buy { font: inherit; padding: 8px 16px; }
  .overlay { position: absolute; left: 0; top: 0; width: 300px; height: 80px; background: #eee; }
</style>
<h1>Long</h1>
<div class="spacer"></div>
<div class="low"><button id="buy">Buy</button><div class="overlay">Sold out</div></div>
