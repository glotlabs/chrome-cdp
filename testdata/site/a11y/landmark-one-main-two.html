<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>landmark-one-main</title>
</head>
<body>
<!-- A page with two visible main landmarks (and a hidden one). -->
<main>
<h1>First main</h1>
</main>
<div role="main">
<p>A second main.</p>
</div>
<main hidden><p>A hidden main does not count.</p></main>
</body>
</html>
