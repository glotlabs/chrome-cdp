<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Forms: checkout</title>
<!-- Every field kind `forms` lists and `fill-form` fills (plan 16, 16.4):
     text-like inputs, a date, a colour, a range, a number, a textarea,
     a <select> and a region <select> that appears once a country is
     chosen (after a short wait, as if fetched), a multiple <select>, a
     custom listbox, a checkbox, a switch, a radio group, a file input and
     a custom combobox (an input whose listbox opens as you type). The
     card number is invalid until it holds 16 digits. Nothing submits:
     #state shows every value the page holds, as JSON, after each input
     or change (and #submitted what a submit sent). -->
<style>
  body { margin: 8px; font: 16px sans-serif; }
  label, fieldset { display: block; margin: 6px 0; }
  [role=listbox] { list-style: none; margin: 0; padding: 0; border: 1px solid #888; width: 12em; }
  [role=option] { padding: 2px 6px; cursor: pointer; }
  [role=option][aria-selected=true] { background: #cde; }
  [role=switch] { min-width: 3em; min-height: 24px; }
  #cities[hidden] { display: none; }
  .error { color: #a00; }
</style>
<h1>Checkout</h1>
<form id="checkout" aria-label="Checkout" method="post" action="/api/orders">
  <label>Email <input type="email" name="email" required></label>
  <label>Full name: <input name="fullname" placeholder="Ada Lovelace" autocomplete="name"></label>
  <label>Card number * <input id="card" name="card" required aria-invalid="true" aria-errormessage="card-error" inputmode="numeric"></label>
  <p id="card-error" class="error">Please enter a valid card number.</p>
  <label>Country
    <select name="country" id="country">
      <option value="">Choose…</option>
      <option value="no">Norway</option>
      <option value="se">Sweden</option>
      <option value="dk">Denmark</option>
      <option value="fi">Finland</option>
    </select>
  </label>
  <div id="region-slot"></div>
  <label>Delivery date <input type="date" name="delivery"></label>
  <label>Wrapping colour <input type="color" name="colour" value="#000000"></label>
  <label>Tip <input type="range" name="tip" min="0" max="20" value="5"></label>
  <label>Quantity <input type="number" name="quantity" min="1" value="1"></label>
  <label>Notes <textarea name="notes"></textarea></label>
  <label>Extras
    <select name="extras" multiple size="3">
      <option value="insurance">Insurance</option>
      <option value="gift">Gift receipt</option>
      <option value="sms">SMS updates</option>
    </select>
  </label>
  <p id="days-label">Delivery days</p>
  <ul role="listbox" id="days" aria-labelledby="days-label" aria-multiselectable="true" tabindex="0">
    <li role="option" aria-selected="false">Monday</li>
    <li role="option" aria-selected="false">Wednesday</li>
    <li role="option" aria-selected="false">Friday</li>
  </ul>
  <label><input type="checkbox" name="save"> Save card</label>
  <p>Newsletter <button type="button" role="switch" aria-checked="false" id="news" aria-label="Newsletter">off</button></p>
  <fieldset>
    <legend>Shipping</legend>
    <label><input type="radio" name="shipping" value="standard" checked> Standard</label>
    <label><input type="radio" name="shipping" value="express"> Express</label>
  </fieldset>
  <label>Receipt <input type="file" name="receipt" accept=".pdf"></label>
  <label for="city">City</label>
  <input id="city" role="combobox" aria-controls="cities" aria-expanded="false" aria-autocomplete="list" autocomplete="off">
  <ul role="listbox" id="cities" aria-label="Cities" hidden></ul>
  <button type="submit">Pay</button>
</form>
<pre id="state"></pre>
<pre id="submitted"></pre>
<script>
  const form = document.getElementById('checkout');
  const REGIONS = { no: ['Oslo', 'Vestland', 'Nordland'], se: ['Stockholm', 'Skåne'], dk: ['Hovedstaden'], fi: ['Uusimaa'] };
  const CITIES = ['Bergen', 'Berlin', 'Bern', 'Oslo', 'Stockholm'];
  const days = document.getElementById('days');
  const news = document.getElementById('news');
  const city = document.getElementById('city');
  const cities = document.getElementById('cities');
  let chosenCity = '';

  function state() {
    const out = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') out[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
      else if (el.type === 'file') out[el.name] = Array.from(el.files).map((f) => f.name);
      else if (el.multiple) out[el.name] = Array.from(el.selectedOptions).map((o) => o.value);
      else out[el.name] = el.value;
    }
    out.days = Array.from(days.querySelectorAll('[aria-selected=true]')).map((o) => o.textContent);
    out.newsletter = news.getAttribute('aria-checked') === 'true';
    out.city = chosenCity;
    out.cardValid = document.getElementById('card').getAttribute('aria-invalid') === 'false';
    return out;
  }
  function show() { document.getElementById('state').textContent = JSON.stringify(state()); }

  document.getElementById('country').addEventListener('change', (e) => {
    const slot = document.getElementById('region-slot');
    slot.textContent = '';
    const regions = REGIONS[e.target.value];
    if (!regions) return show();
    // As if the regions were fetched.
    setTimeout(() => {
      const label = document.createElement('label');
      label.textContent = 'Region ';
      const select = document.createElement('select');
      select.name = 'region';
      select.required = true;
      select.innerHTML = '<option value="">Choose…</option>' + regions.map((r) => `<option>${r}</option>`).join('');
      label.append(select);
      slot.append(label);
      show();
    }, 150);
  });
  document.getElementById('card').addEventListener('input', (e) => {
    const ok = /^\d{4} ?\d{4} ?\d{4} ?\d{4}$/.test(e.target.value);
    e.target.setAttribute('aria-invalid', String(!ok));
    document.getElementById('card-error').hidden = ok;
  });
  days.addEventListener('click', (e) => {
    const option = e.target.closest('[role=option]');
    if (!option) return;
    option.setAttribute('aria-selected', String(option.getAttribute('aria-selected') !== 'true'));
    show();
  });
  news.addEventListener('click', () => {
    const on = news.getAttribute('aria-checked') !== 'true';
    news.setAttribute('aria-checked', String(on));
    news.textContent = on ? 'on' : 'off';
    show();
  });
  city.addEventListener('input', () => {
    const typed = city.value.toLowerCase();
    chosenCity = '';
    cities.innerHTML = '';
    const found = CITIES.filter((c) => typed && c.toLowerCase().startsWith(typed.slice(0, 2)));
    for (const c of found) {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.textContent = c;
      cities.append(li);
    }
    cities.hidden = !found.length;
    city.setAttribute('aria-expanded', String(!!found.length));
  });
  cities.addEventListener('click', (e) => {
    const option = e.target.closest('[role=option]');
    if (!option) return;
    chosenCity = option.textContent;
    city.value = chosenCity;
    cities.hidden = true;
    city.setAttribute('aria-expanded', 'false');
    show();
  });
  form.addEventListener('input', show);
  form.addEventListener('change', show);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('submitted').textContent = JSON.stringify(state());
  });
  show();
</script>
</html>
