# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on security vulnerabilities and unsound crates; warn on yanked ones.
yanked = "warn"
ignore = []

[licenses]
# Permissive licenses only; anything else must be added here deliberately.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list anticipates future dependencies; do not warn about unused entries.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies are fine; the crates are never published.
allow-wildcard-paths = true
# The binary must stay free of OpenSSL (overview §3: rustls only).
deny = [
  { crate = "openssl-sys" },
  { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
