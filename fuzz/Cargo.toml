[package]
name = "chrome-cdp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
protocol = { path = "../crates/protocol" }

# Not part of the main workspace: `cargo fuzz` builds it with nightly.
[workspace]
members = ["."]

[[bin]]
name = "parse_script"
path = "fuzz_targets/parse_script.rs"
test = false
doc = false
bench = false
