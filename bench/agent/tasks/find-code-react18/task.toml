title = "Fix the wrong total after Add in a React 18 app on its Vite dev server"
timeout_secs = 900
prompt = """
Our shop's cart (a React app in ./app) is running on its Vite dev server
at {dev}/. Clicking "Add" next to an item shows the wrong total: the
quantity and the total go up by two of the item, not one. Find the bug in
./app/src, fix it, and check in the browser that adding an item works.
The dev server picks up your edits by itself; leave it running.
"""

[setup]
copy = [
  { from = "testdata/apps-src/react18", to = "app", exclude = ["node_modules"] },
  { from = "testdata/apps-src/shared/public", to = "app/public" },
]
link = [{ from = "testdata/apps-src/react18/node_modules", to = "app/node_modules", hint = "run `cargo xtask apps react18` (needs Node)" }]
# The bug: the item prop (App's state) is changed in place, and App adds
# one more.
replace = [{ file = "app/src/components/CartItem.tsx", from = """
          countClick("add");
          onAdd(item.id);""", to = """
          countClick("add");
          item.qty += 1;
          onAdd(item.id);""" }]
dev = "cd app && exec node node_modules/vite/bin/vite.js --port {port} --strictPort --host 127.0.0.1"

[verify]
page = """
open {dev}/
expect testid=qty-1 text 2 --exact
click testid=add-1
expect testid=qty-1 text 3 --exact
expect testid=total text 'Total: 53' --exact
click testid=add-3
expect testid=qty-3 text 5 --exact
expect testid=total text 'Total: 56' --exact
"""

[solution]
replace = [{ file = "app/src/components/CartItem.tsx", from = """
          item.qty += 1;""", to = "" }]
