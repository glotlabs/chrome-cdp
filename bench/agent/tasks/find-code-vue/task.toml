title = "Fix the Remove buttons of a Vue app on its Vite dev server"
timeout_secs = 900
prompt = """
Our shop's cart (a Vue app in ./app) is running on its Vite dev server at
{dev}/. Its "Remove" buttons remove the wrong item. Find the bug in
./app/src, fix it, and check in the browser that removing an item works.
The dev server picks up your edits by itself; leave it running.
"""

[setup]
copy = [
  { from = "testdata/apps-src/vue", to = "app", exclude = ["node_modules"] },
  { from = "testdata/apps-src/shared/public", to = "app/public" },
]
link = [{ from = "testdata/apps-src/vue/node_modules", to = "app/node_modules", hint = "run `cargo xtask apps vue` (needs Node)" }]
# The bug: the list's index is sent where App wants the item's id.
replace = [
  { file = "app/src/components/CartList.vue", from = 'v-for="item in items"', to = 'v-for="(item, index) in items"' },
  { file = "app/src/components/CartList.vue", from = "@remove=\"emit('remove', $event)\"", to = "@remove=\"emit('remove', index)\"" },
]
dev = "cd app && exec node node_modules/vite/bin/vite.js --port {port} --strictPort --host 127.0.0.1"

[verify]
page = """
open {dev}/
expect testid=item-2 visible
click testid=remove-2
expect testid=item-2 detached
expect testid=item-1 visible
expect testid=item-3 visible
expect testid=total text 'Total: 36' --exact
"""

[solution]
replace = [
  { file = "app/src/components/CartList.vue", from = "@remove=\"emit('remove', index)\"", to = "@remove=\"emit('remove', $event)\"" },
]
