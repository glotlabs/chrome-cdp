[workspace]
resolver = "3"
members = ["crates/*", "xtask", "testdata/load/server"]
default-members = ["crates/*", "testdata/load/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# Off until a license is chosen: crates.io refuses crates without one, and
# cargo-deny fails on publishable unlicensed crates. Set `license` here and
# `publish = true` together (docs/releasing.md).
publish = false
repository = "https://github.com/glotlabs/chrome-cdp"
homepage = "https://github.com/glotlabs/chrome-cdp"

[workspace.dependencies]
# Internal crates. Published to crates.io as chrome-cdp-<name> (the short
# names are taken) for `cargo install chrome-cdp`; each keeps its short lib
# name. `version` must follow the workspace version (`xtask release check`).
cdp = { path = "crates/cdp", package = "chrome-cdp-cdp", version = "0.1.0" }
browser = { path = "crates/browser", package = "chrome-cdp-browser", version = "0.1.0" }
engine = { path = "crates/engine", package = "chrome-cdp-engine", version = "0.1.0" }
daemon = { path = "crates/daemon", package = "chrome-cdp-daemon", version = "0.1.0" }
protocol = { path = "crates/protocol", package = "chrome-cdp-protocol", version = "0.1.0" }
fixtures = { path = "crates/fixtures" }
load-server = { path = "testdata/load/server" }
e2e = { path = "crates/e2e", package = "chrome-cdp-e2e", version = "0.1.0" }
mock = { path = "crates/mock", package = "chrome-cdp-mock", version = "0.1.0" }

# External crates.
base64 = "0.22"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
dashmap = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Latency histograms of `load` runs (plan 23.4): bounded memory, mergeable.
hdrhistogram = { version = "7.5", default-features = false }
heck = "0.5"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2"
# Templates in mock files (plan 11): `{{params.id}}`, `{{uuid}}`, …
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
percent-encoding = "2"
# Decodes and encodes `expect-screenshot` baselines (and screenshots in tests).
png = "0.18"
proptest = "1"
# HTTPS for `chrome-cdp install`: rustls with ring, never OpenSSL (overview §3).
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# SHA-256 of release archives (`chrome-cdp upgrade`); already rustls's crypto.
ring = { version = "0.17", default-features = false }
# Resolves console stack frames to original sources (plan 06).
sourcemap = { version = "9", default-features = false }
# Gzipped traces (`trace stop -o x.json.gz`); already in the tree through `zip`.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
# Unified diffs of `expect-snapshot` baselines (plan 09).
similar = { version = "2", default-features = false, features = ["text"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# "Did you mean" suggestions (plan 08.3); clap already uses it.
strsim = "0.11"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# `chrome-cdp fmt` of mock files (plan 11.12): keeps comments and layout.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
thiserror = "2"
# Unpacks release archives (`chrome-cdp upgrade`).
tar = { version = "0.4", default-features = false }
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
schemars = "1.2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
url = "2"
# OpenAPI specs for `mock check` (plan 11.8); pure Rust and maintained,
# unlike the serde YAML crates.
yaml-rust2 = { version = "0.13", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
# Chrome for Testing zips only use deflate; reading needs no other codec.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
# Denied (not forbidden) so the fd-passing module in `cdp` can opt out with
# `#[allow(unsafe_code)]`. Nothing else may.
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Curated pedantic allow-list: noisy lints that do not pay for themselves.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# No unwrap()/expect() outside tests and `main` (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# No debug info in dev and test builds (`test` inherits from `dev`): smaller
# target dir and faster links. Backtraces keep function names, not lines.
[profile.dev]
debug = false

# Third-party crates optimized in dev and test builds: built once and cached,
# while png, zlib-rs, ring, regex and serde_json are many times slower without.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
