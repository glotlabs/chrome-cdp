[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Internal crates.
cdp = { path = "crates/cdp" }
browser = { path = "crates/browser" }
engine = { path = "crates/engine" }
daemon = { path = "crates/daemon" }
protocol = { path = "crates/protocol" }

# External crates.
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
dashmap = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
heck = "0.5"
libc = "0.2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-stream = { version = "0.1", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[workspace.lints.rust]
# Denied (not forbidden) so the fd-passing module in `cdp` can opt out with
# `#[allow(unsafe_code)]`. Nothing else may.
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Curated pedantic allow-list: noisy lints that do not pay for themselves.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# No unwrap()/expect() outside tests and `main` (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
